# 1회용 - 8 row Google 사진 가져오기 (사용자 2026-04-29 승인)
# 실행 후 워크플로 + 스크립트 삭제 예정

name: TMP - 8 Places Google Photo One-Off

on:
  workflow_dispatch:

concurrency:
  group: tmp-8-places
  cancel-in-progress: false

jobs:
  fetch:
    name: 8 row Google photo + Storage + DB UPDATE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check SUPA_URL secret
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run 8 places fetch
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: node scripts/_tmp_8_places_one_off.mjs
