# ⚠️ 수정금지(승인필요) — EAS Update 자동화 (2026-04-17)
# main 브랜치 푸시 시 Expo Update 자동 배포 → Development Build가 설치된 폰이 앱 재시작 시 최신 JS 번들 fetch
# Secret 필수: EXPO_TOKEN (GitHub repo Settings → Secrets → Actions)
# 참조: docs/EAS-DASHBOARD-GUIDE.md

name: EAS Update on push to main

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - "scripts/**" # ⚠️ 수정금지(승인필요) — 2026-04-27 사용자 승인. 백엔드 cron/시드 스크립트 = 앱 JS 번들 무관 = 불필요한 EAS Update 트리거 차단
  # 2026-04-21 추가: 수동 실행 지원 (지난 실패 복구용)
  workflow_dispatch:

jobs:
  update:
    name: Publish JS update to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "⚠️  EXPO_TOKEN secret is missing. Add it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚠️ 2026-07-26 신설 — 소셜로그인 열쇠 사전 검사(APK 워크플로와 동일 가드).
      # OTA 는 이미 설치된 폰에 JS 를 내려보내는 경로 = 열쇠가 비면 "조용히" 빈 키가 배포됨.
      # 그래서 여기서도 크게 실패시킴(§0 = 조용한 실패 금지).
      - name: 소셜로그인 열쇠 확인 (없으면 중단)
        env:
          G: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          # eas update 는 iOS·Android 번들만 만듦 = 앱이 실제로 쓰는 열쇠만 검사.
          # 카카오 JS키는 웹 전용 → 여기서 요구하면 그 키가 없을 때 로그인과 무관한 수정까지
          # OTA 배포가 전부 막힘(§22 검증 지적). APK 워크플로와 검사 목록 동일하게 통일.
          MISSING=""
          [ -z "$G" ] && MISSING="$MISSING EXPO_PUBLIC_GOOGLE_CLIENT_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ GitHub Secrets 에 없는 열쇠:$MISSING"
            echo "   등록 위치 = repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ 앱 로그인 열쇠 확인"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 2026-04-21 수정: 커밋 메시지 특수문자(→, ?, " 등)로 shell arg 깨짐 방지
      # 환경변수로 전달 + 첫 줄만 추출 + 따옴표 제거
      # workflow_dispatch는 head_commit.message 없음 → SHA 기반 fallback
      - name: Publish EAS Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
          # ⚠️ 2026-07-26 §22 승인 추가 — 소셜로그인 열쇠. OTA 번들도 빌드타임 인라인이라
          #   여기서 안 넘기면 폰에 내려가는 JS 에 키가 빈칸으로 박힘(= 로그인 불가).
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
        run: |
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | head -n 1 | tr -d '"')
          if [ -z "$SAFE_MSG" ]; then
            SAFE_MSG="manual update ${GITHUB_SHA:0:7}"
          fi
          eas update --branch main --message "$SAFE_MSG" --non-interactive
