# ⚠️ 수정금지(승인필요) — EAS Update 자동화 (2026-04-17)
# main 브랜치 푸시 시 Expo Update 자동 배포 → Development Build가 설치된 폰이 앱 재시작 시 최신 JS 번들 fetch
# Secret 필수: EXPO_TOKEN (GitHub repo Settings → Secrets → Actions)
# 참조: docs/EAS-DASHBOARD-GUIDE.md

name: EAS Update on push to main

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  # 2026-04-21 추가: 수동 실행 지원 (지난 실패 복구용)
  workflow_dispatch:

jobs:
  update:
    name: Publish JS update to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "⚠️  EXPO_TOKEN secret is missing. Add it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 2026-04-21 수정: 커밋 메시지 특수문자(→, ?, " 등)로 shell arg 깨짐 방지
      # 환경변수로 전달 + 첫 줄만 추출 + 따옴표 제거
      # workflow_dispatch는 head_commit.message 없음 → SHA 기반 fallback
      - name: Publish EAS Update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | head -n 1 | tr -d '"')
          if [ -z "$SAFE_MSG" ]; then
            SAFE_MSG="manual update ${GITHUB_SHA:0:7}"
          fi
          eas update --branch main --message "$SAFE_MSG" --non-interactive
