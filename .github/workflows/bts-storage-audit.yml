# Storage JPG 보관 상태 감사 (1회성, 읽기 전용 — DB 변경 0)
# 사용자 2026-04-28: 선임 "39 JPG place-images/101/ 저장" 보고 = 미확인
# 본 워크플로 = Storage 실파일 vs DB image_url 대조

name: BTS Storage JPG Audit (read-only)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SUPA_URL
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Audit Storage JPG vs DB
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: node scripts/p2-storage-jpg-audit.mjs
