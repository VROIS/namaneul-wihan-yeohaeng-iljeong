name: TMP - 13 Cities Discovery (Stanford → Toronto)

on:
  workflow_dispatch:

concurrency:
  group: tmp-13cities
  cancel-in-progress: false

jobs:
  pipeline:
    name: Discover 13 cities (textSearch + INSERT + PhotoMedia + Storage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check SUPA_URL
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run 13 cities pipeline
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: node scripts/_tmp_13cities_pipeline.mjs
