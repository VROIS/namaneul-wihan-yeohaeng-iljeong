# ⚠️ 수정금지(승인필요) 2026-07-31 = 아이폰 앱 만들기.
#   아이폰 앱은 맥에서만 만들 수 있어 사장님 PC(윈도우)로는 불가 → EAS 서버에 맡긴다.
#   ⚠️ 자동 실행 안 함(workflow_dispatch 만) = 사장님 지시 없이 굽지 않는다(2026-07-24 SSOT).
name: 아이폰 앱 만들기

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "빌드 종류"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠️ 2026-08-24 = eas-cli(latest)가 Node 22+ 요구로 바뀌어 Node 20 설치 실패(eas-update.yml 과 동일 원인).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --prefer-offline
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 열쇠가 없으면 폰에서 로그인 버튼이 죽는다 = 크게 실패시킨다(조용한 실패 금지 §0)
      - name: 로그인 열쇠 확인
        env:
          G_WEB: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          G_IOS: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          K_NATIVE: ${{ secrets.EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY }}
        run: |
          m=""
          [ -z "$G_WEB" ] && m="$m EXPO_PUBLIC_GOOGLE_CLIENT_ID"
          [ -z "$G_IOS" ] && m="$m EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
          [ -z "$K_NATIVE" ] && m="$m EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY"
          if [ -n "$m" ]; then echo "❌ 열쇠 없음:$m"; exit 1; fi
          echo "✅ 로그인 열쇠 3종 확인"

      - name: 아이폰 앱 만들기
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
          EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY }}
        run: |
          eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
          echo "주문 완료. 20~30분 뒤 https://expo.dev/accounts/vrois/projects/vibetrip/builds 에서 확인"
