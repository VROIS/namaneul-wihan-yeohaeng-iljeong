# ⚠️ 수정금지(승인필요) 2026-09-13 사장님 결정 = TRIPIS(Cloudflare) 자동 배포 1벌 = tripis1 브랜치에 push 하면 워커가 배포된다.
#   왜 필요한가 = 지금까지 배포는 사람이 `wrangler deploy` 를 손으로 친 것뿐이었고(배포 이력 전부 source=wrangler/upload),
#   Cloudflare 쪽 Workers Builds 는 저장소가 연결돼 있지 않다(빌드 이력 0건·build configuration 없음 실측 2026-09-13).
#   그래서 푸시해도 아무 일이 안 일어났다(B 묶음 5602ca3 = 배포 0). 이 파일이 그 구멍을 메운다.
#   Secret 필수 = CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID (저장소 Settings → Secrets and variables → Actions).
#   컨테이너 = 이미 계정 레지스트리에 이미지가 올라가 있으므로 여기서는 굽지 않는다(--containers-rollout=none).
#     컨테이너 코드가 바뀌면 그때 별도 지시로 이미지를 새로 만든다.

name: Deploy TRIPIS Worker (Cloudflare)

on:
  push:
    branches: [tripis1]
    # 워커·공용 스키마·배포 설정이 바뀔 때만. 문서·앱 화면만 바뀐 푸시로는 배포하지 않는다.
    paths:
      - "worker/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tripis-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tripis-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 열쇠 없으면 조용히 성공하지 말고 그 자리에서 멈춘다(무음 실패 금지).
      - name: 열쇠 확인
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID 시크릿이 없습니다."
            exit 1
          fi

      - name: 의존성 설치(락파일 그대로)
        run: npm ci --no-audit --no-fund

      # 워커가 내보내는 정적 화면(public-dist) 조립 = wrangler.jsonc assets.directory 가 이 폴더를 읽는다.
      - name: 웹 화면 빌드 + 워커 자산 조립
        run: |
          npx expo export --platform web
          node scripts/build-worker-assets.mjs

      - name: 배포 전 번들 확인(dry-run)
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry --containers-rollout=none --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 배포
        run: npx wrangler deploy --containers-rollout=none --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 배포가 실제로 살아 있는지 = 운영 주소가 200 을 주는지 확인하고 아니면 실패로 남긴다.
      - name: 배포 확인(운영 응답)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://tripis.app/api/health || true)
            echo "시도 $i = $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::배포 후 https://tripis.app/api/health 가 200 을 주지 않습니다."
          exit 1
