# ⚠️ 수정금지(승인필요) — BTS Direct API 시드 발굴 (Sub-agent 폐기)
# 사용자 2026-04-29 결정:
#   - Sub-agent (Sonnet) → Google Custom Search API
#   - 비용: $3-10/도시 → $0.25/도시 (20배 절감)
#   - 시간: 40분 → 3분 (13배 단축)
#   - AI 토큰 0 = 사용자 SSOT 100% 준수 (TripAdvisor/Wikimedia 잡음 제거)

name: BTS Discover Direct (Google CSE, no sub-agent)

on:
  workflow_dispatch:
    inputs:
      city:
        description: '도시명 (예: Stanford, Las_Vegas)'
        required: false
        type: string
      city_id:
        description: '도시 ID (예: 103). city 와 동시 입력 시 city_id 우선'
        required: false
        type: string

concurrency:
  group: bts-discover-direct
  cancel-in-progress: false

jobs:
  discover:
    name: Direct API discovery (49 queries × 7 categories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SUPA_URL
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run Direct API discovery
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.city_id }}" ]; then
            ARGS+=("--city-id=${{ inputs.city_id }}")
          elif [ -n "${{ inputs.city }}" ]; then
            ARGS+=("--city=${{ inputs.city }}")
          else
            echo "⚠️  city 또는 city_id 입력 필수"
            exit 1
          fi
          echo "🚀 실행: node scripts/p1-bts-google-direct.mjs ${ARGS[*]}"
          node scripts/p1-bts-google-direct.mjs "${ARGS[@]}"
