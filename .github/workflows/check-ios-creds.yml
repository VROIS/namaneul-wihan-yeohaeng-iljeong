name: iOS 서명 상태 확인
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --prefer-offline
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - name: 등록된 아이폰
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        continue-on-error: true
        run: eas device:list --apple-team-id AA86VKNZLZ --non-interactive
      - name: Tripis 프로젝트의 iOS 서명
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        continue-on-error: true
        run: eas credentials --platform ios --non-interactive || echo "(자동 모드에서 목록 조회 불가)"
      - name: 빌드 이력
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
        continue-on-error: true
        run: eas build:list --platform ios --limit 5 --non-interactive
