# BTS 2026 시드 UPSERT 일회성 워크플로 (사용자 v5: MCP 금지, 직접 pg 연결)
# 트리거: gh workflow run bts-bts2026-upsert.yml -f city=elpaso

name: BTS 2026 Seed UPSERT (one-off)

on:
  workflow_dispatch:
    inputs:
      city:
        description: '도시 slug (scripts/sql/{slug}-bts2026/ 와 매칭, 예: elpaso)'
        required: true
        type: string

jobs:
  upsert:
    name: UPSERT consolidated v3 → place_seed_raw
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SUPA_URL secret
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg + dotenv
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run UPSERT
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          CITY_SLUG: ${{ inputs.city }}
        run: |
          echo "🚀 UPSERT for city=$CITY_SLUG"
          node scripts/p2-bts2026-upsert.mjs "$CITY_SLUG"
