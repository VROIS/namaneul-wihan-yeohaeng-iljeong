# 엘파소 40 이미지 확보 검증 (1 회성, 직접 pg)
# 사용자 2026-04-28 명시: 1+2 cron 으로 40 곳 확보됨 — 재확인

name: El Paso 40 Image Verification (one-off)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check SUPA_URL
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg + dotenv
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Verify
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: node scripts/p2-elpaso-verify-40-images.mjs
