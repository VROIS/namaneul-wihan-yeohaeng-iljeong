# ⚠️ 수정금지(승인필요) — Wikipedia/Unsplash 풀 컨텍스트 폴백 v2
# 사용자 2026-04-28 요구:
#   - 6자리 좌표 + 국가 + 주 + 도시 + 영어 장소명 풀 컨텍스트 주입
#   - dry-run 없음 (즉시 commit)
#   - Wikidata SPARQL 1순위 (P625 + P31 + P131)
#   - COALESCE 보호 (기존 Wiki/Unsplash 안 덮어씀)

name: BTS Image Fallback v2 (Wikidata + Wikipedia + Unsplash, full context)

on:
  workflow_dispatch:
    inputs:
      city_id:
        description: 'Supabase city.id (예: 101 = El Paso)'
        required: false
        default: '101'
        type: string

concurrency:
  group: bts-image-fallback-v2
  cancel-in-progress: false

jobs:
  image-fallback-v2:
    name: Wikidata + Wikipedia + Unsplash full context
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check SUPA_URL
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret missing"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pg
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run v2 fallback
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
        run: |
          CITY_ID="${{ inputs.city_id || '101' }}"
          echo "🚀 city_id=$CITY_ID — DB 즉시 저장 모드"
          node scripts/p3-wikipedia-unsplash-fill-v2.mjs --city-id="$CITY_ID"
