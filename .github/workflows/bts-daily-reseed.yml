# ⚠️ 수정금지(승인필요) — BTS 도시별 Google Places 이미지 수집 (수동 trigger)
# 2026-04-28 사용자 결정: 스케줄러 폐기, manual trigger 만 (사용자 1줄 = 1 도시)
# 3 자산 순차 실행 흐름:
#   1) /bts-discover <city> all  → 7 카테고리 발굴 (~6분)
#   2) /bts-image-fill <city_id> → Wiki/Unsplash 채움 (~5분)
#   3) gh workflow run "BTS Daily Reseed (1 city/day, 7 categories)" -f city=<City_Name>
#                                → Google cron 40 곳 (~10분)
#   = 1 도시 완성 (~25분)
#
# Secret 필수 (GitHub repo Settings → Secrets → Actions):
#   - SUPA_URL: postgresql://... (Supabase 접속, GOOGLE_MAPS_API_KEY 는 DB에서 자동 로드)
#
# 호출 분배 (1도시, 2026-04-28 cap 30→40 상향 후):
#   - Text Search Essentials: 40 (vibe 6 × 5 = 30 + restaurant 10)
#   - Place Photos: 40 (Text Search 와 동일, photoName 받은 row 만)
#   - 카테고리 7 = attraction + restaurant + healing + adventure + hotspot + heritage + shopping
#
# 2026-04-29 사용자 정정 (선임/본인 잘못된 코멘트 수정):
#   - "6 categories" → 7 categories (shopping 신규 포함)
#   - cap 30 → 40 (실제 코드 SEARCH_DAILY_LIMIT/PHOTOS_DAILY_LIMIT)
#   - cron textQuery 강화 = name + categoryKw + 좌표 6자리 + city + country (모호 매칭 방지)

name: BTS Daily Reseed (1 city/day, 7 categories)

on:
  # ⚠️ 수정금지(승인필요) — 2026-04-28 사용자 결정: 스케줄 제거, 수동 trigger 만
  # 사용자가 도시 지정해서 manual trigger 시에만 실행
  # 3 자산 (bts-discover + bts-image-fill + bts-daily-reseed) 순차 실행 = 1 도시 완성
  workflow_dispatch:
    inputs:
      city:
        description: '특정 도시 강제 (예: El_Paso, 언더스코어 권장)'
        required: false
        type: string
      category:
        description: '특정 카테고리만 (restaurant/attraction/healing/adventure/hotspot/heritage/shopping). 비우면 모든 카테고리'
        required: false
        type: string
      dry_run:
        description: 'DRY-RUN (호출 0)'
        required: false
        type: boolean
        default: false

# 동시 실행 방지 (schedule + workflow_dispatch 충돌 시 대기열)
concurrency:
  group: bts-daily-reseed
  cancel-in-progress: false

jobs:
  reseed:
    name: BTS 1 city reseed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check SUPA_URL secret
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret is missing. Add it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pg only)
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run BTS daily cron
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          CITY_INPUT: ${{ inputs.city }}
          CATEGORY_INPUT: ${{ inputs.category }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # ⚠️ 수정금지(승인필요) — bash array 사용 필수 (공백 포함 입력 word-split 방지)
          ARGS=()
          if [ -n "$CITY_INPUT" ]; then
            ARGS+=("--city=$CITY_INPUT")
          fi
          if [ -n "$CATEGORY_INPUT" ]; then
            ARGS+=("--category=$CATEGORY_INPUT")
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          echo "🚀 실행: node scripts/p0-bts-daily-cron.mjs ${ARGS[*]}"
          node scripts/p0-bts-daily-cron.mjs "${ARGS[@]}"
