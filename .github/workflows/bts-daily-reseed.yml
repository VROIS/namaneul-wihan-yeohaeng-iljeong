# ⚠️ 수정금지(승인필요) — BTS 일일 자동 재시드 (사용자 2026-04-25 승인)
# 매일 PDT 자정+30분 (UTC 07:30) Google quota reset 직후 1도시 자동 처리
# 32 BTS 도시 / 31일 = 한 달 내 6 카테고리 데이터 완비
#
# Secret 필수 (GitHub repo Settings → Secrets → Actions):
#   - SUPA_URL: postgresql://... (Supabase 접속, GOOGLE_MAPS_API_KEY 는 DB에서 자동 로드)
#
# 호출 분배 (1도시):
#   - Text Search Essentials: 30 (quota cap 정확)
#   - Place Photos: 30 (식당 20 + 다른 5 카테고리 잔여 10)
#   - Wikipedia REST: 180 (무제한)

name: BTS Daily Reseed (1 city/day, 6 categories)

on:
  # ⚠️ 수정금지(승인필요) — 2026-04-27 사용자 승인 v4 자동화 = KST 04:30 (UTC 19:30)
  # 검증 완료: 엘파소 cron v3 (Find Place + Photo + Storage 업로드) = run #25004751231 정상 동작
  # 검증 완료: 엘파소 v3 → 161 row consolidated UPSERT = run #25020003278 정상 동작
  # 재개: 매일 KST 04:30 = Google daily quota reset 후 = 안전
  schedule:
    - cron: '30 19 * * *'  # UTC 19:30 = KST 04:30 (Korea +9)
  workflow_dispatch:
    inputs:
      city:
        description: '특정 도시 강제 (예: El_Paso, 언더스코어 권장)'
        required: false
        type: string
      category:
        description: '특정 카테고리만 (restaurant/attraction/healing/adventure/hotspot/heritage/shopping). 비우면 모든 카테고리'
        required: false
        type: string
      dry_run:
        description: 'DRY-RUN (호출 0)'
        required: false
        type: boolean
        default: false

# 동시 실행 방지 (schedule + workflow_dispatch 충돌 시 대기열)
concurrency:
  group: bts-daily-reseed
  cancel-in-progress: false

jobs:
  reseed:
    name: BTS 1 city reseed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check SUPA_URL secret
        run: |
          if [ -z "${{ secrets.SUPA_URL }}" ]; then
            echo "⚠️  SUPA_URL secret is missing. Add it in repo Settings → Secrets → Actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pg only)
        run: npm ci --no-audit --prefer-offline --omit=dev

      - name: Run BTS daily cron
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          CITY_INPUT: ${{ inputs.city }}
          CATEGORY_INPUT: ${{ inputs.category }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # ⚠️ 수정금지(승인필요) — bash array 사용 필수 (공백 포함 입력 word-split 방지)
          ARGS=()
          if [ -n "$CITY_INPUT" ]; then
            ARGS+=("--city=$CITY_INPUT")
          fi
          if [ -n "$CATEGORY_INPUT" ]; then
            ARGS+=("--category=$CATEGORY_INPUT")
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          echo "🚀 실행: node scripts/p0-bts-daily-cron.mjs ${ARGS[*]}"
          node scripts/p0-bts-daily-cron.mjs "${ARGS[@]}"
