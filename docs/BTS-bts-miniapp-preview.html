<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BTS 미니앱 Preview</title>
  <style>
    :root {
      --space-black: #05050A;
      --bg-dark: #0F0F14;
      --neon-purple: #8B5CF6;
      --deep-violet: #4C1D95;
      --purple-glow: rgba(139, 92, 246, 0.4);
      --purple-glow-light: rgba(139, 92, 246, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-primary: #F9FAFB;
      --text-secondary: #D1D5DB;
      --text-tertiary: #9CA3AF;
      --text-muted: #6B7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
    }

    /* Phone Frame */
    .phone {
      width: 393px; height: 852px;
      background: var(--space-black);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 3px #333, 0 0 60px rgba(0,0,0,0.8);
    }
    .phone::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 126px; height: 34px; background: #000; border-radius: 0 0 20px 20px; z-index: 100;
    }

    /* Scene */
    .scene {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0; pointer-events: none;
      overflow: hidden;
    }
    .scene.active { opacity: 1; pointer-events: all; transform: translateX(0); }
    .scene.exit-left { opacity: 0; transform: translateX(-100%); }

    /* Particles */
    .particles { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 1; }
    .particle {
      position: absolute; background: var(--neon-purple); border-radius: 50%; opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      30% { opacity: 0.4; }
      70% { opacity: 0.3; }
      100% { transform: translateY(-50px) scale(1); opacity: 0; }
    }

    /* Glass Header */
    .glass-header {
      margin: 54px 20px 0;
      height: 56px; border-radius: 20px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      display: flex; align-items: center; padding: 0 16px;
      z-index: 20; position: relative;
      flex-shrink: 0;
    }
    .glass-header .back { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); font-size: 18px; cursor: pointer; background: none; border: none; }
    .glass-header .center { flex: 1; text-align: center; }
    .glass-header .title { font-size: 16px; font-weight: 800; color: var(--text-primary); letter-spacing: 1.5px; }
    .glass-header .sub { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

    /* Background Gradient */
    .bg-gradient {
      position: absolute; top: 0; left: 0; width: 100%; height: 60%;
      background: radial-gradient(ellipse at 50% 0%, var(--deep-violet) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ═══ Scene 1: Character Select ═══ */
    .carousel-wrap {
      flex: 1; display: flex; align-items: center; position: relative; z-index: 10;
      overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; padding: 0 20px;
      gap: 16px;
    }
    .carousel-wrap::-webkit-scrollbar { display: none; }
    .carousel-spacer { min-width: calc(50% - 118px); flex-shrink: 0; }

    .char-card {
      min-width: 236px; height: 380px; scroll-snap-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
      border: 1px solid var(--glass-border); border-radius: 24px;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px; position: relative;
      transition: all 0.3s ease; cursor: pointer;
      transform-style: preserve-3d; flex-shrink: 0;
    }
    .char-card:hover, .char-card.selected {
      border-color: var(--neon-purple);
      box-shadow: 0 0 30px var(--purple-glow);
      transform: scale(1.03);
    }
    .char-avatar {
      width: 110px; height: 110px; border-radius: 55px;
      position: absolute; top: -24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.15s ease-out;
    }
    .char-content { margin-top: 70px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .char-name { font-size: 26px; font-weight: 900; color: var(--text-primary); letter-spacing: 1px; }
    .char-archetype { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .char-desc { font-size: 11px; color: var(--text-tertiary); line-height: 17px; padding: 0 8px; margin-top: 4px; }
    .tag-row { display: flex; gap: 6px; margin-top: 8px; }
    .tag { font-size: 10px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.08); color: var(--text-secondary); }
    .pace-badge {
      margin-top: 8px; padding: 4px 14px; border-radius: 14px;
      background: var(--purple-glow-light); border: 1px solid var(--neon-purple);
      font-size: 11px; color: var(--neon-purple); font-weight: 700;
    }

    /* Indicators */
    .indicators { display: flex; justify-content: center; gap: 6px; padding: 12px 0; position: relative; z-index: 10; flex-shrink: 0; }
    .ind-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--text-muted); transition: all 0.3s; }
    .ind-dot.active { width: 20px; background: var(--neon-purple); }

    /* CTA Button */
    .cta-wrap { padding: 0 24px 34px; position: relative; z-index: 10; flex-shrink: 0; }
    .cta-btn {
      width: 100%; padding: 18px; border-radius: 30px; border: none;
      background: linear-gradient(90deg, var(--neon-purple), var(--deep-violet));
      color: white; font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 24px rgba(139,92,246,0.3);
      transition: transform 0.15s, opacity 0.3s;
      letter-spacing: 0.5px;
    }
    .cta-btn:active { transform: scale(0.97); }
    .cta-btn:disabled { opacity: 0.4; cursor: default; }

    /* ═══ Scene 2: Place Cart ═══ */
    .city-scroll {
      display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
      scrollbar-width: none; position: relative; z-index: 10; flex-shrink: 0;
    }
    .city-scroll::-webkit-scrollbar { display: none; }
    .city-chip {
      padding: 7px 14px; border-radius: 20px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border); color: var(--text-secondary);
      font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
      transition: all 0.2s;
    }
    .city-chip.active {
      background: var(--purple-glow-light); border-color: var(--neon-purple);
      color: var(--neon-purple); font-weight: 700;
    }

    .surround-area {
      flex: 1; position: relative; display: flex; justify-content: center; align-items: center; z-index: 10;
    }
    .center-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; z-index: 20;
      box-shadow: 0 0 40px var(--purple-glow);
      animation: avatarPulse 3s ease-in-out infinite;
    }
    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 30px var(--purple-glow); }
      50% { box-shadow: 0 0 50px rgba(139,92,246,0.6); }
    }

    .surround-card {
      position: absolute; width: 86px; height: 116px; border-radius: 12px;
      background: var(--glass-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px; cursor: pointer; transition: all 0.3s ease;
      opacity: 0; transform: translate(-50%, -50%) scale(0);
      font-size: 10px; color: var(--text-primary); text-align: center; gap: 4px;
    }
    .surround-card.visible {
      opacity: 1; transform: scale(1);
    }
    .surround-card.selected {
      border-color: var(--neon-purple); background: var(--purple-glow-light);
      box-shadow: 0 0 16px rgba(139,92,246,0.3);
    }
    .surround-card .s-emoji { font-size: 22px; }
    .surround-card .s-name { font-weight: 600; line-height: 13px; }
    .surround-card .s-price { font-size: 9px; color: var(--neon-purple); font-weight: 700; }
    .surround-card .check-badge {
      position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 8px;
      background: var(--neon-purple); color: #fff; font-size: 9px; font-weight: 800;
      display: none; align-items: center; justify-content: center;
    }
    .surround-card.selected .check-badge { display: flex; }

    /* Gauge */
    .gauge-wrap { padding: 0 24px; display: flex; align-items: center; gap: 12px; position: relative; z-index: 10; flex-shrink: 0; }
    .gauge-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .gauge-fill { height: 100%; border-radius: 3px; background: var(--neon-purple); transition: width 0.3s; }
    .gauge-text { font-size: 12px; color: var(--text-secondary); font-weight: 700; min-width: 35px; text-align: right; }

    /* ═══ Scene 3: Loading ═══ */
    .loading-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .loading-ring {
      width: 150px; height: 150px; border: 4px solid rgba(255,255,255,0.08);
      border-top-color: var(--neon-purple); border-radius: 50%;
      animation: spin 1.2s linear infinite, ringPulse 2s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ringPulse { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } }
    .loading-emoji { font-size: 28px; margin-top: 32px; animation: fadeSwitch 1s ease-in-out; }
    .loading-msg {
      font-size: 18px; font-weight: 700; color: var(--text-primary); margin-top: 10px;
      letter-spacing: 0.5px; animation: fadeSwitch 1s ease-in-out;
    }
    @keyframes fadeSwitch { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .loading-info { position: absolute; bottom: 80px; font-size: 13px; color: var(--text-muted); }

    /* ═══ Scene 4: Dashboard ═══ */
    .dash-scroll { flex: 1; overflow-y: auto; scrollbar-width: none; position: relative; z-index: 10; }
    .dash-scroll::-webkit-scrollbar { display: none; }
    .section-title { font-size: 20px; font-weight: 900; color: var(--text-primary); padding: 20px 24px 0; }
    .section-sub { font-size: 12px; color: var(--text-tertiary); padding: 4px 24px 16px; }

    /* Reels */
    .reels-row {
      display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none;
      padding: 0 24px; scroll-snap-type: x mandatory;
    }
    .reels-row::-webkit-scrollbar { display: none; }
    .reel-card {
      min-width: 260px; height: 320px; border-radius: 20px;
      border: 1px solid var(--glass-border); overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px; position: relative; scroll-snap-align: center; flex-shrink: 0;
    }
    .reel-cat {
      position: absolute; top: 16px; left: 16px; padding: 4px 10px;
      border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .reel-time { font-size: 14px; font-weight: 800; color: var(--neon-purple); margin-bottom: 6px; }
    .reel-name { font-size: 20px; font-weight: 900; color: var(--text-primary); margin-bottom: 6px; }
    .reel-desc { font-size: 12px; color: var(--text-secondary); line-height: 17px; }

    /* Timeline */
    .timeline-row { display: flex; padding: 0 24px; margin-bottom: 4px; }
    .timeline-line { width: 24px; display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
    .timeline-dot { width: 12px; height: 12px; border-radius: 6px; flex-shrink: 0; }
    .timeline-connector { width: 2px; flex: 1; background: rgba(255,255,255,0.08); margin-top: 4px; }
    .timeline-card {
      flex: 1; background: var(--glass-bg); border-radius: 16px; padding: 14px;
      margin-left: 8px; margin-bottom: 8px; border: 1px solid var(--glass-border);
    }
    .timeline-card-header { display: flex; align-items: center; gap: 10px; }
    .tl-emoji { font-size: 22px; }
    .tl-info { flex: 1; }
    .tl-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .tl-time { font-size: 11px; color: var(--neon-purple); font-weight: 600; margin-top: 2px; }
    .tl-price { background: var(--purple-glow-light); padding: 3px 8px; border-radius: 10px; font-size: 11px; color: var(--neon-purple); font-weight: 700; }
    .tl-reason { font-size: 12px; color: var(--text-tertiary); margin-top: 8px; line-height: 17px; }

    /* Summary */
    .summary-card {
      margin: 24px 24px 20px; border-radius: 20px; padding: 20px;
      background: linear-gradient(180deg, var(--purple-glow-light), transparent);
      border: 1px solid var(--glass-border);
    }
    .summary-title { font-size: 16px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px; }
    .summary-row { display: flex; justify-content: space-around; }
    .summary-item { text-align: center; }
    .summary-value { font-size: 22px; font-weight: 900; color: var(--neon-purple); }
    .summary-label { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

    /* Bottom Actions */
    .bottom-actions {
      display: flex; gap: 10px; padding: 12px 20px 34px;
      background: linear-gradient(transparent, var(--space-black) 30%);
      position: relative; z-index: 10; flex-shrink: 0;
    }
    .secondary-btn {
      flex: 1; padding: 16px; border-radius: 30px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border); color: var(--text-secondary);
      font-size: 14px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .primary-btn-wrap { flex: 2; }
    .primary-btn-wrap .cta-btn { padding: 16px; font-size: 15px; }
  </style>
</head>

<div class="phone">
  <!-- ═══════ Scene 1: Character Select ═══════ -->

    <div class="glass-header">

    <div class="carousel-wrap" id="carousel">

  <!-- ═══════ Scene 2: Place Cart ═══════ -->

    <div class="city-scroll" id="cityScroll"></div>

  <!-- ═══════ Scene 3: Loading ═══════ -->
  <div class="scene" id="scene3">
    <div class="bg-gradient"></div>
    <div class="loading-center">

      <div class="loading-emoji" id="loadEmoji">🎵</div>
      <div class="loading-msg" id="loadMsg">바이브 동기화 중...</div>
    </div>
    <div class="loading-info" id="loadInfo" style="text-align:center;width:100%">서울 · 컬렉터 · 4곳</div>
  </div>

  <!-- ═══════ Scene 4: Dashboard ═══════ -->
  <div class="scene" id="scene4">
    <div class="bg-gradient"></div>

    <div class="glass-header">
      <button class="back" onclick="resetAll()">✕</button>
      <div class="center">
        <div class="title" id="dashTitle">나만의 방탄 투어</div>
      </div>
      <button class="back" style="color:var(--neon-purple);font-weight:700" onclick="alert('공유 기능')">↗</button>
    </div>

    <div class="dash-scroll" id="dashScroll">
      <!-- Injected by JS -->
    </div>

    <div class="bottom-actions">
      <button class="secondary-btn" onclick="resetAll()">처음부터 다시</button>
      <div class="primary-btn-wrap">
        <button class="cta-btn" onclick="alert('🗺️ 일정이 공유되었습니다!')">🗺️ 이 일정 공유하기</button>
      </div>
    </div>
  </div>
</div>

];

const CAT_COLORS = { attraction:'#3B82F6', healing:'#10B981', restaurant:'#F59E0B', hotspot:'#EC4899', adventure:'#EF4444' };
const CAT_EMOJI = { attraction:'🏛️', healing:'🧘', restaurant:'🍽️', hotspot:'📸', adventure:'🏔️' };

let selectedChar = null;
let selectedCity = 0;
let selectedPlaceSet = new Set();

// ─── Particles ───
function spawnParticles(containerId) {
  const c = document.getElementById(containerId);
  for(let i=0; i<20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random()*4+2;
    p.style.width = s+'px'; p.style.height = s+'px';
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (Math.random()*6+6)+'s';
    p.style.animationDelay = (Math.random()*5)+'s';
    c.appendChild(p);
  }
}
spawnParticles('particles1');

// ─── Scene 1: Build Carousel ───
const carousel = document.getElementById('carousel');
const indicators = document.getElementById('indicators');

CHARACTERS.forEach((ch, i) => {
  // Card
  const card = document.createElement('div');
  card.className = 'char-card';
  card.dataset.index = i;
  card.innerHTML = `
    <div class="char-avatar" style="background:${ch.gradient}">${ch.emoji}</div>
    <div class="char-content">
      <div class="char-name">${ch.name}</div>
      <div class="char-archetype">${ch.nameEn}</div>
      <div class="char-desc">${ch.desc}</div>
      <div class="tag-row">${ch.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="pace-badge">${ch.pace}</div>
    </div>
  `;
  card.onclick = () => selectChar(i);
  carousel.appendChild(card);

  // Indicator
  const dot = document.createElement('div');
  dot.className = 'ind-dot';
  dot.id = 'dot-'+i;
  indicators.appendChild(dot);
});

const spacer2 = document.createElement('div');
spacer2.className = 'carousel-spacer';
carousel.appendChild(spacer2);

// Parallax on mouse
document.addEventListener('mousemove', e => {
  const cards = document.querySelectorAll('.char-card');
  const xAxis = (window.innerWidth/2 - e.clientX) / 40;
  const yAxis = (window.innerHeight/2 - e.clientY) / 40;
  cards.forEach(c => {
    if(c.classList.contains('selected')) {
      c.querySelector('.char-avatar').style.transform = `translateX(${-xAxis*0.5}px) translateY(${-yAxis*0.5}px)`;
    }
  });
});

function selectChar(idx) {
  selectedChar = idx;
  document.querySelectorAll('.char-card').forEach((c,i) => {
    c.classList.toggle('selected', i===idx);
  });
  document.querySelectorAll('.ind-dot').forEach((d,i) => {
    d.classList.toggle('active', i===idx);
  });
  const ch = CHARACTERS[idx];
  const btn = document.getElementById('cta1');
  btn.disabled = false;
  btn.textContent = `${ch.name} 바이브로 시작하기 ✨`;
}

// ─── Scene Transitions ───
function showScene(id) {
  document.querySelectorAll('.scene').forEach(s => {
    s.classList.remove('active');
    s.classList.add('exit-left');
  });
  setTimeout(() => {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('exit-left'));
    document.getElementById(id).classList.add('active');
  }, 100);
}

function goToScene1() { showScene('scene1'); }

function goToScene2() {
  if(selectedChar === null) return;
  const ch = CHARACTERS[selectedChar];
  document.getElementById('s2-title').textContent = ch.name + '의 바이브 스팟';
  document.getElementById('centerAvatar').textContent = ch.emoji;
  document.getElementById('centerAvatar').style.background = ch.gradient;
  selectedPlaceSet.clear();
  buildCityChips();
  buildSurroundCards();
  updateGauge();
  showScene('scene2');
}

function goToScene3() {
  if(selectedPlaceSet.size < 2) return;
  const ch = CHARACTERS[selectedChar];
  const city = CITIES[selectedCity];
  document.getElementById('loadInfo').textContent = `${city} · ${ch.name} · ${selectedPlaceSet.size}곳`;
  showScene('scene3');

  // Loading messages
  const msgs = [
    { emoji:'🎵', text:'바이브 동기화 중...' },
    { emoji:'🗺️', text:'경로 최적화 연산 중...' },
    { emoji:'📡', text:'현지 정보 스캔 완료!' },
    { emoji:'☁️', text:'날씨·교통 체킹 완료' },
    { emoji:'🎉', text:'최종 동선 생성 완료 ✨' },
  ];
  let step = 0;
  const iv = setInterval(() => {
    step++;
    if(step >= msgs.length) {
      clearInterval(iv);
      setTimeout(() => goToScene4(), 600);
      return;
    }
    document.getElementById('loadEmoji').textContent = msgs[step].emoji;
    document.getElementById('loadMsg').textContent = msgs[step].text;
  }, 900);
}

function goToScene4() {
  buildDashboard();
  showScene('scene4');
}

function resetAll() {
  selectedChar = null;
  selectedPlaceSet.clear();
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.ind-dot').forEach(d => d.classList.remove('active'));
  document.getElementById('cta1').disabled = true;
  document.getElementById('cta1').textContent = '캐릭터를 선택하세요';
  showScene('scene1');
}

// ─── Scene 2: City Chips ───
function buildCityChips() {
  const wrap = document.getElementById('cityScroll');
  wrap.innerHTML = '';
  CITIES.forEach((c, i) => {
    const chip = document.createElement('div');
    chip.className = 'city-chip' + (i===selectedCity?' active':'');
    chip.textContent = c;
    chip.onclick = () => {
      selectedCity = i;
      document.querySelectorAll('.city-chip').forEach((cc,j) => cc.classList.toggle('active', j===i));
    };
    wrap.appendChild(chip);
  });
}

// ─── Scene 2: Surround Cards ───
function buildSurroundCards() {
  const area = document.getElementById('surroundArea');
  area.querySelectorAll('.surround-card').forEach(c => c.remove());
  const radius = 130;
  const total = MOCK_PLACES.length;

  MOCK_PLACES.forEach((p, i) => {
    const angle = (i / total) * (2 * Math.PI) - Math.PI / 2;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;

    const card = document.createElement('div');
    card.className = 'surround-card';
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="s-emoji">${p.emoji}</div>
      <div class="s-name">${p.name}</div>
      <div class="s-price">${p.price}</div>
      <div class="check-badge">✓</div>
    `;
    card.style.left = `calc(50% + ${x}px)`;
    card.style.top = `calc(50% + ${y}px)`;

    card.onclick = () => togglePlace(i, card);

    area.appendChild(card);

    // Staggered entrance
    setTimeout(() => card.classList.add('visible'), 300 + i * 80);
  });
}

function togglePlace(idx, card) {
  if(selectedPlaceSet.has(idx)) {
    selectedPlaceSet.delete(idx);
    card.classList.remove('selected');
  } else {
    if(selectedPlaceSet.size >= 8) return;
    selectedPlaceSet.add(idx);
    card.classList.add('selected');
  }
  updateGauge();
}

function updateGauge() {
  const count = selectedPlaceSet.size;
  document.getElementById('gaugeFill').style.width = (count/8*100)+'%';
  document.getElementById('gaugeText').textContent = count + ' / 8';
  document.getElementById('s2-sub').textContent = `${count}/8 선택됨 · 2개 이상 선택하세요`;
  document.getElementById('cta2').disabled = count < 2;
}

// ─── Scene 4: Build Dashboard ───
function buildDashboard() {
  const ch = CHARACTERS[selectedChar];
  const city = CITIES[selectedCity];
  const selected = [...selectedPlaceSet].map(i => MOCK_PLACES[i]);
  const TIMES = ['09:30','11:00','12:30','14:00','15:30','17:00','18:30','20:00'];
  const ENDS  = ['11:00','12:30','14:00','15:30','17:00','18:30','20:00','21:30'];

  document.getElementById('dashTitle').textContent = `나만의 방탄 투어 - ${city}`;

  const scroll = document.getElementById('dashScroll');
  scroll.innerHTML = '';

  // Reels section
  scroll.innerHTML += `<div class="section-title">미리보기</div><div class="section-sub">스와이프해서 장소를 탐색하세요</div>`;
  let reelsHtml = '<div class="reels-row">';
  selected.forEach((p, i) => {
    const color = CAT_COLORS[p.cat] || '#8B5CF6';
    reelsHtml += `
      <div class="reel-card" style="background:linear-gradient(180deg,${color}30,var(--space-black))">
        <div class="reel-cat" style="background:${color}30;color:${color}">${p.cat}</div>
        <div class="reel-time">${TIMES[i]||'09:30'}</div>
        <div class="reel-name">${p.name}</div>
        <div class="reel-desc">${ch.name} 바이브에 딱 맞는 추천 장소</div>
      </div>
    `;
  });
  reelsHtml += '</div>';
  scroll.innerHTML += reelsHtml;

  // Timeline section
  scroll.innerHTML += `<div class="section-title" style="margin-top:24px">스마트 타임라인</div><div class="section-sub">${city} · ${selected.length}곳 · ${ch.name} 바이브</div>`;
  let tlHtml = '';
  selected.forEach((p, i) => {
    const color = CAT_COLORS[p.cat] || '#8B5CF6';
    const isLast = i === selected.length - 1;
    tlHtml += `
      <div class="timeline-row">
        <div class="timeline-line">
          <div class="timeline-dot" style="background:${color}"></div>
          ${isLast ? '' : '<div class="timeline-connector"></div>'}
        </div>
        <div class="timeline-card">
          <div class="timeline-card-header">
            <span class="tl-emoji">${p.emoji}</span>
            <div class="tl-info">
              <div class="tl-name">${p.name}</div>
              <div class="tl-time">${TIMES[i]||'09:30'} - ${ENDS[i]||'21:00'}</div>
            </div>
            <span class="tl-price">${p.price}</span>
          </div>
          <div class="tl-reason">💡 ${ch.name} 스타일에 최적화된 동선 배치</div>
        </div>
      </div>
    `;
  });
  scroll.innerHTML += tlHtml;

  // Summary
  const totalCost = selected.reduce((sum, p) => sum + (parseInt(p.price.replace(/[^0-9]/g,''))||0), 0);
  scroll.innerHTML += `
    <div class="summary-card">
      <div class="summary-title">📊 여행 요약</div>
      <div class="summary-row">
        <div class="summary-item"><div class="summary-value">${selected.length}곳</div><div class="summary-label">장소</div></div>
        <div class="summary-item"><div class="summary-value">${(selected.length*1.5).toFixed(1)}h</div><div class="summary-label">예상 시간</div></div>
        <div class="summary-item"><div class="summary-value">€${totalCost}</div><div class="summary-label">예상 비용</div></div>
      </div>
    </div>
    <div style="height:20px"></div>
  `;
}
</script>
</body>
</html>
