<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tripis — AI Travel Companion</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EF;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --muted: #6B6459;
    --line: #ECE6DA;
    --line-2: #E0D9CC;
    --accent: #4285F4;
    --coral: #E85D4A;
    --coral-deep: #C13F2D;
    --gold: #B8883D;
    --success: #10B981;
  }
  html, body { margin: 0; padding: 0; background: #1A1A1A; color: var(--ink); font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01','ss02','cv11'; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  .serif { font-family: 'Pretendard Variable', 'Pretendard', 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; letter-spacing: -0.035em; font-feature-settings: 'ss01','ss02'; }
  .display { font-family: 'Space Grotesk', 'Pretendard Variable', 'Pretendard', sans-serif; letter-spacing: -0.04em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* stage */
  .stage {
    min-height: 100vh; width: 100%;
    background:
      radial-gradient(1200px 800px at 10% 0%, rgba(232,93,74,0.08) 0%, transparent 50%),
      radial-gradient(1000px 600px at 95% 100%, rgba(66,133,244,0.06) 0%, transparent 50%),
      #0E0D0B;
    padding: 54px 36px 80px;
  }
  .canvas-header {
    color: #fff; margin-bottom: 48px; max-width: 1100px;
  }
  .canvas-header .kicker { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .canvas-header .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--coral); box-shadow: 0 0 0 4px rgba(232,93,74,0.2); }
  .canvas-header h1 { font-family: 'Pretendard Variable', 'Pretendard', sans-serif; font-size: 56px; font-weight: 800; line-height: 1.02; letter-spacing: -2.4px; margin: 0 0 18px; color: #fff; }
  .canvas-header h1 em { font-style: normal; color: var(--coral); font-weight: 700; }
  .canvas-header p { max-width: 640px; line-height: 1.65; color: rgba(255,255,255,0.62); font-size: 15px; margin: 0; }

  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 72px; }
  .variant-title { color: #fff; margin-bottom: 28px; max-width: 1100px; }
  .variant-title .tag { display: inline-block; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
  .variant-title h2 { font-family: 'Pretendard Variable', 'Pretendard', sans-serif; font-size: 34px; font-weight: 800; color: #fff; margin: 0 0 8px; letter-spacing: -1.3px; line-height: 1.12; }
  .variant-title p { color: rgba(255,255,255,0.55); font-size: 14px; line-height: 1.6; margin: 0; max-width: 620px; }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); margin: 0 0 64px; max-width: 1200px; }

  /* tweaks */
  .tweaks-panel {
    position: fixed; right: 22px; bottom: 22px; z-index: 9999;
    width: 280px;
    background: rgba(20,18,14,0.92); backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
    color: #fff; padding: 16px; font-size: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    display: none;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-panel h4 { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 0 0 12px; }
  .tweaks-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tweaks-row label { flex: 1 1 0; min-width: 0; padding: 8px 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; text-align: center; cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.75); transition: all .15s; }
  .tweaks-row label.active { background: var(--coral); border-color: var(--coral); color: #fff; }
  .tweaks-row input { display: none; }
  .tweaks-label { font-size: 11px; color: rgba(255,255,255,0.55); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#FAF6EF"/><circle cx="100" cy="100" r="50" fill="none" stroke="#1A1A1A" stroke-width="4"/><circle cx="100" cy="100" r="8" fill="#E85D4A"/><path d="M100 50 L106 90 L100 93 L94 90 Z" fill="#1A1A1A"/></svg>
</template>

<div id="root"></div>

<div id="tweaks" class="tweaks-panel">
  <h4>Tweaks</h4>
  <div class="tweaks-label">Theme</div>
  <div class="tweaks-row" data-group="theme">
    <label><input type="radio" name="theme" value="light"><span>Light</span></label>
    <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
  </div>
  <div class="tweaks-label">Logo variant (onboarding)</div>
  <div class="tweaks-row" data-group="logo">
    <label><input type="radio" name="logo" value="A"><span>Compass</span></label>
    <label><input type="radio" name="logo" value="B"><span>Serif</span></label>
    <label><input type="radio" name="logo" value="C"><span>Block</span></label>
  </div>
  <div class="tweaks-label">Accent</div>
  <div class="tweaks-row" data-group="accent">
    <label><input type="radio" name="accent" value="blue"><span>Blue</span></label>
    <label><input type="radio" name="accent" value="coral"><span>Coral</span></label>
    <label><input type="radio" name="accent" value="forest"><span>Forest</span></label>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tripia-shared.jsx"></script>
<script type="text/babel" src="tripia-onboarding.jsx"></script>
<script type="text/babel" src="tripia-variantA.jsx"></script>
<script type="text/babel" src="tripia-variantB.jsx"></script>
<script type="text/babel" src="tripia-variantC.jsx"></script>
<script type="text/babel" src="tripia-shared-screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "blue",
  "logo": "B"
}/*EDITMODE-END*/;

function applyAccent(accent) {
  const map = {
    blue: '#4285F4',
    coral: '#E85D4A',
    forest: '#2F7A54',
  };
  document.documentElement.style.setProperty('--accent', map[accent] || map.blue);
}

// Variant section with controlled tab state per phone
function VariantRow({ title, tag, desc, variant, dark }) {
  const [tabHome, setTabHome] = React.useState('home');
  const [tabLive, setTabLive] = React.useState('live');
  const [tabVoice, setTabVoice] = React.useState('voice');
  const [tabArchive, setTabArchive] = React.useState('archive');
  const [tabProfile, setTabProfile] = React.useState('profile');

  // Pick phones per variant
  const phones = [];
  if (variant === 'onboarding') {
    phones.push({ label: '01 · WELCOME', comp: <OnboardingScreen dark={dark} onDone={() => {}}/> });
  } else if (variant === 'A') {
    phones.push(
      { label: '01 · HOME', comp: <VariantA_Home dark={dark} tab={tabHome} setTab={setTabHome}/> },
      { label: '02 · LIVE CAMERA', comp: <VariantA_Live dark tab={tabLive} setTab={setTabLive}/> },
      { label: '03 · VOICE CHAT', comp: <VariantA_Voice dark={dark} tab={tabVoice} setTab={setTabVoice}/> },
    );
  } else if (variant === 'B') {
    phones.push(
      { label: '01 · JOURNEY', comp: <VariantB_Home dark={dark} tab={tabHome} setTab={setTabHome}/> },
      { label: '02 · ARCHIVE', comp: <ArchiveScreen dark={dark} tab={tabArchive} setTab={setTabArchive}/> },
      { label: '03 · PROFILE', comp: <ProfileScreen dark={dark} tab={tabProfile} setTab={setTabProfile}/> },
    );
  } else if (variant === 'C') {
    phones.push(
      { label: '01 · CONTEXT HUB', comp: <VariantC_Home dark={dark} tab={tabHome} setTab={setTabHome}/> },
      { label: '02 · ARCHIVE', comp: <ArchiveScreen dark tab={tabArchive} setTab={setTabArchive}/> },
      { label: '03 · VOICE', comp: <VariantA_Voice dark tab={tabVoice} setTab={setTabVoice}/> },
    );
  }

  return (
    <>
      <div className="variant-title" data-screen-label={title}>
        <div className="tag">{tag}</div>
        <h2>{title}</h2>
        <p>{desc}</p>
      </div>
      <div className="row">
        {phones.map(p => (
          <Phone key={p.label} label={p.label} dark={dark}>{p.comp}</Phone>
        ))}
      </div>
      <div className="divider"/>
    </>
  );
}

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  React.useEffect(() => { applyAccent(tweaks.accent); }, [tweaks.accent]);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('open');
      if (e.data.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('open');
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Wire tweak inputs
  React.useEffect(() => {
    const panel = document.getElementById('tweaks');
    // update checked state
    panel.querySelectorAll('input[type=radio]').forEach(input => {
      input.checked = tweaks[input.name] === input.value;
      input.parentElement.classList.toggle('active', input.checked);
    });
    const onChange = (e) => {
      if (e.target.matches('input[type=radio]')) {
        const next = { ...tweaks, [e.target.name]: e.target.value };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [e.target.name]: e.target.value } }, '*');
      }
    };
    panel.addEventListener('change', onChange);
    return () => panel.removeEventListener('change', onChange);
  }, [tweaks]);

  const dark = tweaks.theme === 'dark';

  return (
    <div className="stage">
      <div className="canvas-header">
        <div className="kicker"><span className="dot"/> TRIPIS · PROTOTYPE · 3 DIRECTIONS</div>
        <h1>당신의 여행을 전담하는,<br/>세상에 하나뿐인 <em>AI 비서</em>.</h1>
        <p>
          초행 해외여행자를 위한 AI 동반자 <strong style={{color:'#fff'}}>Tripis(트리피스)</strong>의 세 가지 방향을 탐색합니다. Tripis는 <em style={{fontStyle:'normal',color:'#fff'}}>Trip + is</em> — 아이폰의 Siri처럼, 여행의 모든 순간 옆에 있는 AI 비서입니다.
          공통 온보딩 뒤 Voice-first / Journey-timeline / Context-hub 세 홈 스크린을 비교하세요.
          하단 Tweaks 토글로 라이트/다크 · 액센트를 바꿀 수 있어요.
        </p>
      </div>

      <VariantRow
        title="공통 온보딩"
        tag="SHARED · ONBOARDING"
        desc="첫 실행: 브랜드 소개 → 페르소나 선택 → Gemma 4 온디바이스 모델 다운로드 → 준비 완료. Tripis 브랜드 마크(날개 달린 눈 + T)를 사용합니다."
        variant="onboarding" dark={dark}
      />

      <VariantRow
        title="Variation A — Voice-First Companion"
        tag="DIRECTION 01 · AGENT-AS-HERO"
        desc="트리피스가 주인공. 홈 상단은 '듣고 있는 AI'가 차지하고, 실제 발화/답변/액션이 바로 드러납니다. 여정은 얇은 타임라인으로 뒤로 물러나고, 라이브 카메라 · 음성 오버레이가 핵심 화면. 목소리로 여행을 다니는 사람에게 맞춤."
        variant="A" dark={dark}
      />

      <VariantRow
        title="Variation B — Journey Timeline"
        tag="DIRECTION 02 · PLAN-AS-HERO"
        desc="여정이 주인공. 홈은 오늘의 타임라인이고 각 스팟이 카드로 펼쳐지며 AI는 각 스팟에 붙는 주석/팁으로 존재. 계획형 여행자와 5060 가족 고객을 위한 구조. 기억/프로필까지 일관된 '선' 메타포."
        variant="B" dark={dark}
      />

      <VariantRow
        title="Variation C — Context Hub"
        tag="DIRECTION 03 · SITUATION-AS-HERO"
        desc="'지금 어디에 있고 무얼 하고 있냐'가 홈. GPS/카메라/시간/일정으로 상황을 감지해 적절한 모듈(번역/팁/SOS/파업 알림/가족 공유)을 최상단으로 끌어올립니다. 초행자의 불안을 구조적으로 낮추는 방향."
        variant="C" dark={dark}
      />

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
