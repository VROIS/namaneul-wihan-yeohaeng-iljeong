<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tripia — 통합 앱 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F5;
    --bg-2: #F1EEE8;
    --ink: #1A1A1A;
    --ink-2: #3A3A3A;
    --muted: #6B7280;
    --muted-2: #9CA3AF;
    --line: rgba(26,26,26,0.08);
    --line-2: rgba(26,26,26,0.14);
    --surface: #FFFFFF;
    --accent: #4285F4;
    --accent-ink: #1A73E8;
    --coral: #E85D4A;
    --coral-deep: #C73E2D;
    --success: #10B981;
    --gold: #D4AF37;
  }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-feature-settings: 'ss01', 'ss02';
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  * { box-sizing: border-box; }
  .serif { font-family: 'Noto Serif KR', 'Pretendard Variable', serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.01em; }
  button { font-family: inherit; }
  /* tiny scrollbars */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tripia-shared.jsx"></script>
  <script type="text/babel" src="tripia-variantA.jsx"></script>
  <script type="text/babel" src="tripia-variantB.jsx"></script>
  <script type="text/babel" src="tripia-variantC.jsx"></script>
  <script type="text/babel" src="tripia-onboarding.jsx"></script>
  <script type="text/babel" src="tripia-app.jsx"></script>
</body>
</html>
