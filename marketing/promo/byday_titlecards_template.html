<!doctype html><html><head><meta charset="utf-8"><title>BY DAY / BY NIGHT title cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Oswald:wght@500;700&family=Inter:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=block">
</head><body style="background:#111;color:#eee;font:14px sans-serif">
<p>JSON-driven template. Edit CONFIG per city, open in Chrome (via local server, logo next to this file), click a button to download MP4 (1080x1920, 30fps, H.264 + silent AAC).</p>
<button onclick="go('opening')">opening</button><button onclick="go('ending')">ending</button><button onclick="go('endcard')">endcard</button>
<script>
const CONFIG = {
  "city": "Kaohsiung",
  "accent": "#e0703a",
  "nightAccent": "#ffb37a",
  "fiction": "Fan-made fiction · illustrated characters",
  "opening": {
    "duration": 1.5,
    "kicker": "EP.1 · KAOHSIUNG · BTS WORLD TOUR",
    "line1": "BY DAY,",
    "line2": "HE WAS YOUR",
    "slot": [
      "DRIVER.",
      "BARISTA.",
      "CHEF.",
      "STRANGER."
    ],
    "job": "GUIDE."
  },
  "ending": {
    "duration": 2,
    "lines": [
      "BY NIGHT,",
      "HE WAS",
      "A STAR."
    ]
  },
  "endcard": {
    "duration": 3,
    "url": "tripis.app",
    "info": [
      "Nov 19 · 21 · 22 · Kaohsiung National Stadium",
      "R17 World Games Exit 1 → 800m",
      "R17 世運站 1號出口"
    ]
  },
  "next": {
    "line1": "Next city: Bangkok.",
    "line2": "Who will he be?",
    "accent": "#e6c15a"
  }
};
const LOGO_URL = "tripis-mark.png";
</script>
<script>
(function(){
const W=1080,H=1920,FPS=30;
const SAFE={top:192,bottom:1920-422,left:90,right:1080-130};
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const easeBack=t=>{t=Math.max(0,Math.min(1,t));const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function grain(seed){const c=document.createElement('canvas');c.width=360;c.height=640;const g=c.getContext('2d');const d=g.createImageData(360,640);let s=seed;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const v=s%255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;}
const grains=[grain(7),grain(99),grain(1234),grain(555)];
function fitFont(ctx,text,weightFam,size,maxW){let s=size;ctx.font=weightFam.replace('%s',s);while(ctx.measureText(text).width>maxW&&s>10){s-=2;ctx.font=weightFam.replace('%s',s);}return s;}
function corner(ctx,cfg,alpha){ctx.save();ctx.globalAlpha=alpha*0.75;ctx.fillStyle=cfg.cornerColor||'rgba(255,255,255,0.8)';ctx.font='500 26px Inter';ctx.textBaseline='alphabetic';ctx.fillText(cfg.fiction,SAFE.left,SAFE.bottom-10);ctx.restore();}

// (a) OPENING: BY DAY / HE WAS YOUR <JOB>
function drawOpening(ctx,t,cfg){
  const T=cfg.opening.duration;
  // warm daylight background
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#f7eedd');bg.addColorStop(1,'#efdcc0');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // light leak
  const lx=W*(0.2+0.6*(t/T)),lg=ctx.createRadialGradient(lx,H*0.25,0,lx,H*0.25,900);lg.addColorStop(0,cfg.accent+'66');lg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  // grain
  ctx.save();ctx.globalAlpha=0.07;ctx.globalCompositeOperation='multiply';ctx.drawImage(grains[Math.floor(t*24)%4],0,0,W,H);ctx.restore();
  const x=SAFE.left+10;
  // kicker
  const ka=ease((t-0.0)/0.25);ctx.save();ctx.globalAlpha=ka;ctx.fillStyle='#6b5640';ctx.font='700 34px Inter';
  const kick=cfg.opening.kicker.split('').join(String.fromCharCode(8202));fitFont(ctx,kick,'700 %spx Inter',34,SAFE.right-x);ctx.fillText(kick,x,560);ctx.restore();
  // BY DAY, mask reveal
  ctx.save();const r1=ease((t-0.05)/0.3);ctx.beginPath();ctx.rect(x-10,600,(SAFE.right-x+20)*r1,240);ctx.clip();
  ctx.fillStyle='#2a1d14';ctx.font='800 168px "Playfair Display"';ctx.fillText(cfg.opening.line1,x,780);ctx.restore();
  // accent rule
  ctx.fillStyle=cfg.accent;ctx.fillRect(x,812,260*ease((t-0.25)/0.3),8);
  // HE WAS YOUR
  ctx.save();ctx.globalAlpha=ease((t-0.25)/0.25);ctx.fillStyle='#2a1d14';ctx.font='italic 700 92px "Playfair Display"';ctx.fillText(cfg.opening.line2,x,960);ctx.restore();
  // slot machine job word
  const words=cfg.opening.slot.concat([cfg.opening.job]);
  const st=0.35,en=1.0,p=clamp((t-st)/(en-st),0,1);
  const total=words.length-1;const sm=p<0.85?(p/0.85)*(p/0.85)*(3-2*(p/0.85)):1;const pos=total*sm+Math.sin(clamp((p-0.85)/0.15,0,1)*Math.PI)*-0.08;
  const lineH=150,baseY=1120;
  const jobSize=fitFont(ctx,cfg.opening.job,'800 %spx "Playfair Display"',132,SAFE.right-x);
  ctx.save();ctx.beginPath();ctx.rect(x-10,baseY-lineH+20,SAFE.right-x+20,lineH+10);ctx.clip();
  for(let i=0;i<words.length;i++){const y=baseY+(i-pos)*lineH;if(y<baseY-lineH*1.2||y>baseY+lineH*1.2)continue;
    const isJob=i===words.length-1;ctx.fillStyle=isJob?cfg.accent:'#8a7560';ctx.globalAlpha=isJob?1:0.55;
    fitFont(ctx,words[i],'800 %spx "Playfair Display"',isJob?jobSize:jobSize*0.9,SAFE.right-x);ctx.fillText(words[i],x,y);}
  ctx.restore();ctx.globalAlpha=1;
  corner(ctx,{fiction:cfg.fiction,cornerColor:'rgba(60,45,30,0.85)'},ease((t-0.2)/0.3));
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,35,10,0.18)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// (b) ENDING TITLE: BY NIGHT, HE WAS A STAR.
const dots=[...Array(140)].map((_,i)=>({x:(i*733)%1080,y:1200+((i*397)%700),r:2+(i%5),ph:i*0.7}));
function drawNight(ctx,t,cfg,beam){
  const bg=ctx.createRadialGradient(W/2,H*0.35,50,W/2,H*0.4,H);bg.addColorStop(0,'#3a1670');bg.addColorStop(0.55,'#1a0b3a');bg.addColorStop(1,'#07051a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const d of dots){const a=0.25+0.35*Math.sin(t*6+d.ph);ctx.fillStyle='rgba(180,120,255,'+Math.max(0,a)+')';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();}
  if(beam!==null){ctx.save();ctx.globalCompositeOperation='lighter';ctx.filter='blur(28px)';ctx.translate(W/2,-100);ctx.rotate(beam);const g=ctx.createLinearGradient(0,0,0,H*1.3);g.addColorStop(0,'rgba(235,210,255,0.45)');g.addColorStop(0.6,'rgba(170,110,255,0.18)');g.addColorStop(1,'rgba(150,90,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(30,0);ctx.lineTo(260,H*1.3);ctx.lineTo(-260,H*1.3);ctx.closePath();ctx.fill();ctx.restore();}
}
function glowText(ctx,txt,x,y,font,on,color){ctx.save();ctx.font=font;ctx.fillStyle='rgba(255,255,255,'+(0.12+0.88*on)+')';ctx.shadowColor=color;ctx.shadowBlur=40*on;ctx.fillText(txt,x,y);ctx.shadowBlur=12*on;ctx.fillText(txt,x,y);ctx.restore();}
function drawEnding(ctx,t,cfg){
  const T=cfg.ending.duration;const sweep=0.75-1.5*ease(t/(T*0.9));
  drawNight(ctx,t,cfg,sweep);
  const x=SAFE.left+10;const beamX=W/2+Math.tan(sweep)*1100;
  const lines=cfg.ending.lines;const ys=[760,900,1110];
  lines.forEach((ln,i)=>{const size=i===2?200:120;const f='700 %spx Oswald';const s=fitFont(ctx,ln,f,size,SAFE.right-x);
    const on=ease((t-(0.15+0.28*i))/0.35);
    glowText(ctx,ln,x,ys[i],f.replace('%s',s),on,i===2?cfg.nightAccent:'#b58cff');});
  corner(ctx,cfg,1);
}

// (c) END CARD
function drawEndCard(ctx,t,cfg,logo){
  const T=cfg.endcard.duration;drawNight(ctx,t,cfg,null);
  const x=SAFE.left+10,maxW=SAFE.right-x;
  // next city (top)
  const a1=ease(t/0.4);ctx.save();ctx.globalAlpha=a1;
  ctx.fillStyle=cfg.next.accent;fitFont(ctx,cfg.next.line1,'700 %spx Oswald',84,maxW);ctx.fillText(cfg.next.line1,x,360+30*(1-a1));
  ctx.fillStyle='#ffffff';fitFont(ctx,cfg.next.line2,'italic 700 %spx "Playfair Display"',74,maxW);ctx.fillText(cfg.next.line2,x,460+30*(1-a1));ctx.restore();
  // logo + info
  const a2=ease((t-0.6)/0.5);ctx.save();ctx.globalAlpha=a2;
  const lw=260,lh=lw*logo.height/logo.width;ctx.drawImage(logo,x,600+20*(1-a2),lw,lh);
  ctx.fillStyle='#c9a6ff';fitFont(ctx,cfg.endcard.url,'700 %spx Inter',88,maxW);ctx.fillText(cfg.endcard.url,x,600+lh+110);
  let y=600+lh+200;
  for(const ln of cfg.endcard.info){const isZh=/[\u4e00-\u9fff]/.test(ln);const f=isZh?'700 %spx "Noto Sans TC"':'500 %spx Inter';fitFont(ctx,ln,f,isZh?46:40,maxW);ctx.fillStyle=isZh?'#ffffff':'rgba(255,255,255,0.9)';ctx.fillText(ln,x,y);y+=isZh?78:68;}
  ctx.restore();
  corner(ctx,cfg,1);
}

async function encode(kind,cfg,logo){
  const M=window.__M;const dur=cfg[kind].duration;const N=Math.round(dur*FPS);
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const target=new M.ArrayBufferTarget();
  const muxer=new M.Muxer({target,video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:{codec:'aac',sampleRate:48000,numberOfChannels:2},fastStart:'in-memory'});
  const ve=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{throw e}});
  ve.configure({codec:'avc1.640028',width:W,height:H,bitrate:8e6,framerate:FPS});
  const ae=new AudioEncoder({output:(ch,meta)=>muxer.addAudioChunk(ch,meta),error:e=>{throw e}});
  ae.configure({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2,bitrate:128000});
  const fn={opening:drawOpening,ending:drawEnding,endcard:drawEndCard}[kind];
  for(let i=0;i<N;i++){const t=i/FPS;ctx.clearRect(0,0,W,H);fn(ctx,t,cfg,logo);
    const vf=new VideoFrame(c,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(vf,{keyFrame:i%30===0});vf.close();
    if(i%10===0) await new Promise(r=>setTimeout(r,0));}
  const total=Math.round(dur*48000);const chunk=1024;
  for(let s=0;s<total;s+=chunk){const n=Math.min(chunk,total-s);const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(s*1e6/48000),data:new Float32Array(n*2)});ae.encode(ad);ad.close();}
  await ve.flush();await ae.flush();muxer.finalize();
  const buf=new Uint8Array(target.buffer);let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(bin);
}
async function still(kind,cfg,logo,t){const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');({opening:drawOpening,ending:drawEnding,endcard:drawEndCard})[kind](ctx,t,cfg,logo);return c.toDataURL('image/jpeg',0.85);}
window.TITLES={encode,still};
})();</script>
<script type="module">
window.__M = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm");
const im = new Image(); im.src = LOGO_URL; await im.decode(); window.__LOGO = im;
await Promise.all(['800 120px "Playfair Display"','italic 700 120px "Playfair Display"','700 120px Oswald','700 40px Inter','500 40px Inter','700 40px "Noto Sans TC"'].map(f=>document.fonts.load(f,"A世")));
window.go = async (k) => { const b64 = await TITLES.encode(k, CONFIG, window.__LOGO); const a=document.createElement("a"); a.href="data:video/mp4;base64,"+b64; a.download="byday_"+CONFIG.city.toLowerCase()+"_"+k+".mp4"; a.click(); };
</script></body></html>
